<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Control & Gallery Manager - FOTOME</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FDFBF7;
      padding: 20px 10px;
      color: #3D2B2B;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .admin-container {
      width: 100%;
      max-width: 440px;
      background: #FFF;
      border-radius: 24px;
      padding: 20px 14px;
      box-shadow: 0 10px 30px rgba(140, 98, 98, 0.08);
      border: 1px solid rgba(216, 180, 180, 0.3);
      overflow: hidden;
    }

    .main-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.78rem;
      color: #777;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* NAVIGASI TAB UTAMA ADMIN */
    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 2px solid #FAF6EE;
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #FAF6EE;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #8C6262;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #8C6262;
      color: #FFF;
      box-shadow: 0 4px 12px rgba(140, 98, 98, 0.2);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* FORM CARD TAMBAH PROJEK */
    .form-card {
      background: #FAF6EE;
      border: 1px solid rgba(216, 180, 180, 0.4);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .form-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 3px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #D8B4B4;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      background: #FFF;
    }

    .btn-add {
      background: #8C6262;
      color: #FFF;
      border: none;
      padding: 10px;
      border-radius: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.82rem;
      box-shadow: 0 4px 12px rgba(140, 98, 98, 0.2);
    }

    /* KARTU ITEM PROJEK */
    .event-card {
      border: 1px solid #EAE0E0;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF;
    }

    .info-left { text-align: left; flex: 1; }
    .project-name { font-size: 0.85rem; font-weight: 700; color: #3D2B2B; }
    .project-id { font-size: 0.68rem; color: #888; margin-bottom: 3px; }

    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; display: inline-block; }
    .badge-on { background: #E8F5E9; color: #2E7D32; }
    .badge-off { background: #FFEBEE; color: #C62828; }

    .btn-toggle {
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.72rem;
      color: #FFF;
    }
    .btn-on { background: #C62828; }
    .btn-off { background: #2E7D32; }

    .btn-delete {
      background: transparent;
      border: none;
      color: #BBB;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      margin-left: 6px;
    }

    /* GRID ADMIN RAPI SERAGAM (3 KOLOM PRESISI) */
    .gallery-grid-admin {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }

    .gallery-grid-card {
      background: #FFF;
      border: 1px solid #EAE0E0;
      border-radius: 10px;
      padding: 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      overflow: hidden;
      width: 100%;
    }

    .gallery-grid-card:active {
      transform: scale(0.96);
    }

    .gallery-thumb-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      background: #FAF6EE;
      margin-bottom: 4px;
    }

    .gallery-thumb-grid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-grid-name {
      font-size: 0.65rem;
      font-weight: 700;
      color: #8C6262;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }

    .gallery-grid-msg {
      font-size: 0.58rem;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
      font-style: italic;
    }

    /* MODAL POP-UP (ZOOM, DOWNLOAD & HAPUS) */
    .hidden { display: none !important; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-card {
      background: #FFF;
      border-radius: 20px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #FAF6EE;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      color: #8C6262;
      cursor: pointer;
    }

    .modal-user-name {
      font-size: 1rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 2px;
    }

    .modal-img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
    }

    .modal-msg {
      font-size: 0.82rem;
      color: #333;
      font-style: italic;
      background: #FAF6EE;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .btn-modal-dl {
      flex: 1;
      background: #2E7D32;
      color: #FFF;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-modal-del {
      flex: 1;
      background: #C62828;
      color: #FFF;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./js/config.js"></script>
</head>
<body>

<div class="admin-container">
  <h2 class="main-title">Photobooth Control</h2>
  <p class="sub-title">Kelola saklar akses & moderasi galeri foto ucapan.</p>

  <!-- TAB NAVIGASI -->
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('tab-projects', this)">
      <i class="fa-solid fa-toggle-on"></i> Saklar Event
    </button>
    <button class="tab-btn" onclick="switchTab('tab-gallery', this)">
      <i class="fa-solid fa-images"></i> Kelola Galeri
    </button>
  </div>

  <!-- TAB 1: SAKLAR EVENT -->
  <div id="tab-projects" class="tab-content active">
    <div class="form-card">
      <div class="form-title">➕ Tambah Projek Baru</div>
      <div class="form-group">
        <label>Nama File / Client</label>
        <input type="text" id="input-filename" placeholder="v2.html">
      </div>
      <div class="form-group">
        <label>ID Dokumen Firestore</label>
        <input type="text" id="input-docid" placeholder="v2_event">
      </div>
      <button class="btn-add" onclick="addNewProject()">Tambahkan</button>
    </div>

    <div style="font-size: 0.85rem; font-weight: 700; text-align: left; margin-bottom: 10px;">Daftar Projek</div>
    <div id="project-list-container">
      <p style="font-size: 0.75rem; color: #999;">Memuat daftar...</p>
    </div>
  </div>

  <!-- TAB 2: KELOLA GALERI (GRID SERAGAM) -->
  <div id="tab-gallery" class="tab-content">
    <div style="font-size: 0.8rem; text-align: left; margin-bottom: 10px; color: #8C6262; font-weight: 700;">
      Klik foto untuk perbesar, unduh, atau hapus
    </div>
    <div id="gallery-grid-container" class="gallery-grid-admin">
      <p style="font-size: 0.75rem; color: #999; grid-column: span 3; text-align: center;">Memuat kiriman galeri...</p>
    </div>
  </div>

</div>

<!-- MODAL POP-UP (ZOOM, DOWNLOAD & HAPUS) -->
<div id="admin-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <button class="modal-close-btn" onclick="closeAdminModal()">✕</button>
    <div class="modal-user-name" id="modal-sender-name">Nama Tamu</div>
    <div style="font-size:0.68rem; color:#888;" id="modal-event-id">Event ID</div>
    <img id="modal-img-src" class="modal-img" src="" alt="Foto Strip">
    <div class="modal-msg" id="modal-sender-msg">"Pesan ucapan..."</div>
    <div class="modal-actions">
      <button class="btn-modal-dl" id="btn-modal-download">
        <i class="fa-solid fa-download"></i> Unduh Foto
      </button>
      <button class="btn-modal-del" id="btn-modal-delete">
        <i class="fa-solid fa-trash"></i> Hapus Foto
      </button>
    </div>
  </div>
</div>

<script>
  // TAB SWITCHING
  function switchTab(tabId, btnElem) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElem.classList.add('active');

    if (tabId === 'tab-gallery') {
      loadGalleryAdmin();
    }
  }

  // 1. KONTROL SAKLAR EVENT
  db.collection('settings').onSnapshot(snapshot => {
    const container = document.getElementById('project-list-container');
    container.innerHTML = '';

    if (snapshot.empty) {
      container.innerHTML = '<p style="font-size: 0.75rem; color: #999;">Belum ada projek.</p>';
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const docId = doc.id;
      const fileName = data.fileName || docId;
      const isActive = data.isActive === true;

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="info-left">
          <div class="project-name">${fileName}</div>
          <div class="project-id">ID: ${docId}</div>
          <span class="badge ${isActive ? 'badge-on' : 'badge-off'}">
            ${isActive ? 'ON' : 'OFF'}
          </span>
        </div>
        <div style="display:flex; align-items:center;">
          <button class="btn-toggle ${isActive ? 'btn-on' : 'btn-off'}" onclick="toggleEventStatus('${docId}', ${isActive})">
            ${isActive ? 'OFF' : 'ON'}
          </button>
          <button class="btn-delete" title="Hapus" onclick="deleteProject('${docId}')">🗑️</button>
        </div>
      `;
      container.appendChild(card);
    });
  });

  function addNewProject() {
    const fileName = document.getElementById('input-filename').value.trim();
    const docId = document.getElementById('input-docid').value.trim();

    if (!fileName || !docId) {
      alert("Harap isi Nama File dan ID Dokumen!");
      return;
    }

    db.collection('settings').doc(docId).set({
      fileName: fileName,
      isActive: true,
      title: "Riyan & Amelia",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true })
    .then(() => {
      document.getElementById('input-filename').value = '';
      document.getElementById('input-docid').value = '';
    });
  }

  function toggleEventStatus(docId, currentStatus) {
    db.collection('settings').doc(docId).set({ isActive: !currentStatus }, { merge: true });
  }

  function deleteProject(docId) {
    if (confirm(`Hapus projek "${docId}"?`)) {
      db.collection('settings').doc(docId).delete();
    }
  }

  // 2. KELOLA GALERI (GRID KOTAK RAPI SERAGAM)
  function loadGalleryAdmin() {
    const container = document.getElementById('gallery-grid-container');

    db.collection('posts').onSnapshot(snapshot => {
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p style="font-size: 0.75rem; color: #999; grid-column: span 3; text-align: center;">Belum ada foto yang masuk di galeri.</p>';
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();
        const postId = doc.id;
        const name = data.name || 'Tamu';
        const msg = data.message || '-';

        const card = document.createElement('div');
        card.className = 'gallery-grid-card';
        card.onclick = () => openAdminModal(postId, name, msg, data.photoData, data.eventId);

        card.innerHTML = `
          <div class="gallery-thumb-box">
            <img src="${data.photoData}" class="gallery-thumb-grid" alt="Thumb">
          </div>
          <div class="gallery-grid-name">${name}</div>
          <div class="gallery-grid-msg">"${msg}"</div>
        `;
        container.appendChild(card);
      });
    });
  }

  // MODAL KONTROL (ZOOM, DOWNLOAD & HAPUS)
  let activePostId = null;
  let activePhotoUrl = "";
  let activeSenderName = "";

  function openAdminModal(postId, name, message, photoData, eventId) {
    activePostId = postId;
    activePhotoUrl = photoData;
    activeSenderName = name;

    document.getElementById('modal-sender-name').innerText = name;
    document.getElementById('modal-event-id').innerText = `ID Event: ${eventId || '-'}`;
    document.getElementById('modal-sender-msg').innerText = `"${message}"`;
    document.getElementById('modal-img-src').src = photoData;

    document.getElementById('btn-modal-download').onclick = () => {
      const a = document.createElement('a');
      a.href = activePhotoUrl;
      a.download = `Photobooth-${activeSenderName.replace(/\s+/g, '-')}.jpg`;
      a.click();
    };

    document.getElementById('btn-modal-delete').onclick = () => {
      if (confirm(`Apakah kamu yakin ingin menghapus foto ucapan dari "${activeSenderName}" ini?`)) {
        db.collection('posts').doc(activePostId).delete()
          .then(() => {
            alert("Foto berhasil dihapus!");
            closeAdminModal();
          })
          .catch(err => alert("Gagal menghapus: " + err.message));
      }
    };

    document.getElementById('admin-modal').classList.remove('hidden');
  }

  function closeAdminModal() {
    document.getElementById('admin-modal').classList.add('hidden');
  }
</script>

</body>
</html>
