<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Switcher - FOTOME</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FDFBF7;
      padding: 30px 15px;
      color: #3D2B2B;
    }
    .admin-container {
      max-width: 500px;
      margin: 0 auto;
      background: #FFF;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .event-card {
      border: 1px solid #EAE0E0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-on { background: #E8F5E9; color: #2E7D32; }
    .badge-off { background: #FFEBEE; color: #C62828; }
    .btn-toggle {
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./js/config.js"></script>
</head>
<body>

<div class="admin-container">
  <h2>Saklar Kontrol Photobooth</h2>
  <p style="font-size:0.8rem; color:#777;">Aktifkan/nonaktifkan akses halaman virtual photobooth per projek.</p>

  <!-- EVENT 1: Main Project (index.html) -->
  <div class="event-card">
    <div>
      <strong>1. index.html</strong><br>
      <span id="status-1" class="badge badge-off">Memuat...</span>
    </div>
    <button id="btn-1" class="btn-toggle" onclick="toggleStatus('wedding_event', isStatus1Active)">Ubah</button>
  </div>

  <!-- EVENT 2: Rudi Project (rudi.html) -->
  <div class="event-card">
    <div>
      <strong>2. rudi.html</strong><br>
      <span id="status-2" class="badge badge-off">Memuat...</span>
    </div>
    <button id="btn-2" class="btn-toggle" onclick="toggleStatus('rudi_event', isStatus2Active)">Ubah</button>
  </div>
</div>

<script>
  let isStatus1Active = false;
  let isStatus2Active = false;

  // Realtime Listener index.html (wedding_event)
  db.collection('settings').doc('wedding_event').onSnapshot(doc => {
    if (doc.exists) {
      isStatus1Active = doc.data().isActive === true;
      document.getElementById('status-1').innerText = isStatus1Active ? "ONLINE / ON" : "OFFLINE / OFF";
      document.getElementById('status-1').className = "badge " + (isStatus1Active ? "badge-on" : "badge-off");
      document.getElementById('btn-1').innerText = isStatus1Active ? "Matikan" : "Aktifkan";
    }
  });

  // Realtime Listener rudi.html (rudi_event)
  db.collection('settings').doc('rudi_event').onSnapshot(doc => {
    if (doc.exists) {
      isStatus2Active = doc.data().isActive === true;
      document.getElementById('status-2').innerText = isStatus2Active ? "ONLINE / ON" : "OFFLINE / OFF";
      document.getElementById('status-2').className = "badge " + (isStatus2Active ? "badge-on" : "badge-off");
      document.getElementById('btn-2').innerText = isStatus2Active ? "Matikan" : "Aktifkan";
    }
  });

  function toggleStatus(docId, currentStatus) {
    db.collection('settings').doc(docId).set({
      isActive: !currentStatus
    }, { merge: true });
  }
</script>

</body>
</html>
