<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Control & Gallery Manager - FOTOME</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FDFBF7;
      padding: 20px 10px;
      color: #3D2B2B;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .admin-container {
      width: 100%;
      max-width: 440px;
      background: #FFF;
      border-radius: 24px;
      padding: 20px 14px;
      box-shadow: 0 10px 30px rgba(140, 98, 98, 0.08);
      border: 1px solid rgba(216, 180, 180, 0.3);
      overflow: hidden;
    }

    .main-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.78rem;
      color: #777;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* NAVIGASI TAB UTAMA ADMIN */
    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 2px solid #FAF6EE;
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #FAF6EE;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #8C6262;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #8C6262;
      color: #FFF;
      box-shadow: 0 4px 12px rgba(140, 98, 98, 0.2);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* FORM CARD TAMBAH PROJEK */
    .form-card {
      background: #FAF6EE;
      border: 1px solid rgba(216, 180, 180, 0.4);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .form-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 3px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #D8B4B4;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      background: #FFF;
    }

    .btn-add {
      background: #8C6262;
      color: #FFF;
      border: none;
      padding: 10px;
      border-radius: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.82rem;
      box-shadow: 0 4px 12px rgba(140, 98, 98, 0.2);
    }

    /* KARTU ITEM PROJEK */
    .event-card {
      border: 1px solid #EAE0E0;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF;
    }

    .info-left { text-align: left; flex: 1; }
    .project-name { font-size: 0.85rem; font-weight: 700; color: #3D2B2B; }
    .project-id { font-size: 0.68rem; color: #888; margin-bottom: 3px; }

    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; display: inline-block; }
    .badge-on { background: #E8F5E9; color: #2E7D32; }
    .badge-off { background: #FFEBEE; color: #C62828; }

    .btn-toggle {
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.72rem;
      color: #FFF;
    }
    .btn-on { background: #C62828; }
    .btn-off { background: #2E7D32; }

    .btn-delete {
      background: transparent;
      border: none;
      color: #BBB;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      margin-left: 6px;
    }

    /* COUNTER SUMMARY BADGE */
    .gallery-stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .stat-badge-total {
      background: #FAF6EE;
      color: #8C6262;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid rgba(216,180,180,0.4);
    }

    .stat-badge-selected {
      background: #E8F5E9;
      color: #2E7D32;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid #C8E6C9;
    }

    /* BATCH ACTION BAR */
    .batch-bar {
      background: #FAF6EE;
      border: 1px solid rgba(216, 180, 180, 0.4);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .batch-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .batch-select-all {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #8C6262;
      cursor: pointer;
    }

    .batch-select-all input {
      accent-color: #8C6262;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .batch-buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .btn-batch-dl-plain {
      background: #2E7D32;
      color: #FFF;
      border: none;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .btn-batch-dl-msg {
      background: #1565C0;
      color: #FFF;
      border: none;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .btn-batch-del {
      background: #C62828;
      color: #FFF;
      border: none;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    /* GRID ADMIN RAPI SERAGAM */
    .gallery-grid-admin {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }

    .gallery-grid-card {
      background: #FFF;
      border: 1px solid #EAE0E0;
      border-radius: 10px;
      padding: 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .gallery-grid-card.selected {
      border-color: #8C6262;
      background: #FFFBF6;
    }

    .card-checkbox-wrapper {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
    }

    .card-checkbox {
      accent-color: #8C6262;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .gallery-thumb-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      background: #FAF6EE;
      margin-bottom: 4px;
    }

    .gallery-thumb-grid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-grid-name {
      font-size: 0.65rem;
      font-weight: 700;
      color: #8C6262;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }

    .gallery-grid-msg {
      font-size: 0.58rem;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
      font-style: italic;
    }

    /* MODAL POP-UP */
    .hidden { display: none !important; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-card {
      background: #FFF;
      border-radius: 20px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #FAF6EE;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      color: #8C6262;
      cursor: pointer;
    }

    .modal-user-name {
      font-size: 1rem;
      font-weight: 700;
      color: #8C6262;
      margin-bottom: 2px;
    }

    .modal-img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
    }

    .modal-msg {
      font-size: 0.82rem;
      color: #333;
      font-style: italic;
      background: #FAF6EE;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .modal-actions-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-modal-dl-plain {
      background: #2E7D32;
      color: #FFF;
      border: none;
      padding: 9px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-modal-dl-msg {
      background: #1565C0;
      color: #FFF;
      border: none;
      padding: 9px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-modal-del {
      background: #C62828;
      color: #FFF;
      border: none;
      padding: 9px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    canvas { display: none; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./js/config.js"></script>
</head>
<body>

<div class="admin-container">
  <h2 class="main-title">Photobooth Control</h2>
  <p class="sub-title">Kelola saklar akses & moderasi galeri foto ucapan.</p>

  <!-- TAB NAVIGASI -->
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('tab-projects', this)">
      <i class="fa-solid fa-toggle-on"></i> Saklar Event
    </button>
    <button class="tab-btn" onclick="switchTab('tab-gallery', this)">
      <i class="fa-solid fa-images"></i> Kelola Galeri
    </button>
  </div>

  <!-- TAB 1: SAKLAR EVENT -->
  <div id="tab-projects" class="tab-content active">
    <div class="form-card">
      <div class="form-title">➕ Tambah Projek Baru</div>
      <div class="form-group">
        <label>Nama File / Client</label>
        <input type="text" id="input-filename" placeholder="v2.html">
      </div>
      <div class="form-group">
        <label>ID Dokumen Firestore</label>
        <input type="text" id="input-docid" placeholder="v2_event">
      </div>
      <button class="btn-add" onclick="addNewProject()">Tambahkan</button>
    </div>

    <div style="font-size: 0.85rem; font-weight: 700; text-align: left; margin-bottom: 10px;">Daftar Projek</div>
    <div id="project-list-container">
      <p style="font-size: 0.75rem; color: #999;">Memuat daftar...</p>
    </div>
  </div>

  <!-- TAB 2: KELOLA GALERI -->
  <div id="tab-gallery" class="tab-content">
    
    <!-- STATS COUNTER BAR -->
    <div class="gallery-stats-bar">
      <span class="stat-badge-total" id="stat-total-photos">Total Foto: 0</span>
      <span class="stat-badge-selected" id="stat-selected-photos">Terpilih: 0</span>
    </div>

    <!-- BARIS KONTROL AKSI MASAL -->
    <div class="batch-bar">
      <div class="batch-top-row">
        <label class="batch-select-all">
          <input type="checkbox" id="check-select-all" onchange="toggleSelectAll(this)">
          <span>Pilih Semua</span>
        </label>
      </div>

      <div class="batch-buttons-grid">
        <button class="btn-batch-dl-plain" onclick="downloadSelectedPosts(false)">
          <i class="fa-solid fa-download"></i> Unduh Polos
        </button>
        <button class="btn-batch-dl-msg" onclick="downloadSelectedPosts(true)">
          <i class="fa-solid fa-envelope-open-text"></i> + Pesan
        </button>
        <button class="btn-batch-del" onclick="deleteSelectedPosts()">
          <i class="fa-solid fa-trash"></i> Hapus
        </button>
      </div>
    </div>

    <div id="gallery-grid-container" class="gallery-grid-admin">
      <p style="font-size: 0.75rem; color: #999; grid-column: span 3; text-align: center;">Memuat kiriman galeri...</p>
    </div>
  </div>

</div>

<!-- MODAL POP-UP INDIVIDUAL DENGAN 2 OPSI UNDUH -->
<div id="admin-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <button class="modal-close-btn" onclick="closeAdminModal()">✕</button>
    <div class="modal-user-name" id="modal-sender-name">Nama Tamu</div>
    <img id="modal-img-src" class="modal-img" src="" alt="Foto Strip">
    <div class="modal-msg" id="modal-sender-msg">"Pesan ucapan..."</div>
    
    <div class="modal-actions-col">
      <button class="btn-modal-dl-plain" id="btn-modal-dl-plain">
        <i class="fa-solid fa-download"></i> Unduh Foto Polos (Tanpa Pesan)
      </button>
      <button class="btn-modal-dl-msg" id="btn-modal-dl-msg">
        <i class="fa-solid fa-envelope-open-text"></i> Unduh Foto + Pesan Ucapan
      </button>
      <button class="btn-modal-del" id="btn-modal-delete">
        <i class="fa-solid fa-trash"></i> Hapus Foto
      </button>
    </div>
  </div>
</div>

<canvas id="exportCanvas"></canvas>

<script>
  let allGalleryPosts = []; 

  function formatFileName(name, msg, withMsg = false) {
    const cleanName = (name || 'Tamu').replace(/[^\w\s-]/gi, '').trim() || 'Tamu';
    const cleanMsg = (msg || '').replace(/[^\w\s-]/gi, '').trim();

    if (withMsg && cleanMsg && cleanMsg !== '-') {
      const shortMsg = cleanMsg.substring(0, 30);
      return `${cleanName} - ${shortMsg}.jpg`;
    }
    return `${cleanName}.jpg`;
  }

  // FUNGSI HELPER: WORD-WRAP TEKS PANJANG DENGAN UKURAN HIGH-DPI
  function wrapCanvasText(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let currentLine = words[0] || "";

    for (let i = 1; i < words.length; i++) {
      const word = words[i];
      const width = ctx.measureText(currentLine + " " + word).width;
      if (width < maxWidth) {
        currentLine += " " + word;
      } else {
        lines.push(currentLine);
        currentLine = word;
      }
    }
    lines.push(currentLine);
    return lines;
  }

  // FUNGSI MELUKIS DENGAN RESOLUSI MAKSIMAL ULTRA HD (3X HIGH-DPI)
  function generateImageWithText(photoUrl, name, message, callback) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');

      // 1. Dapatkan resolusi asli foto (misal: 600px x 1800px)
      const baseWidth = img.naturalWidth || img.width || 600;
      const baseHeight = img.naturalHeight || img.height || 1800;

      // 2. Tentukan FAKTOR SKALA ULTRA HD (2x lipat ketajaman piksel)
      const scale = 2; 

      const imgW = baseWidth * scale;
      const imgH = baseHeight * scale;

      // Setting ukuran font & margin sesuai skala High-DPI
      const maxTextWidth = imgW - (120 * scale);
      const fontSizeName = Math.round(22 * scale);
      const fontSizeMsg = Math.round(17 * scale);
      const lineHeight = Math.round(fontSizeMsg * 1.45);

      ctx.font = `italic ${fontSizeMsg}px 'Plus Jakarta Sans', sans-serif`;
      const cleanMsg = (message && message !== '-') ? `"${message}"` : "";
      const msgLines = cleanMsg ? wrapCanvasText(ctx, cleanMsg, maxTextWidth) : [];

      // Hitung kebutuhan tinggi footer
      let footerHeight = 0;
      if (name || msgLines.length > 0) {
        footerHeight = Math.round(70 * scale) + (name ? Math.round(35 * scale) : 0) + (msgLines.length * lineHeight);
      }

      // Ukuran Canvas Fisik Ultra HD
      canvas.width = imgW;
      canvas.height = imgH + footerHeight;

      // KUALITAS SMOOTHING MAKSIMAL (VECTOR LIKE)
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 3. Gambar Foto Utama dengan Skala Resolusi Tinggi
      ctx.drawImage(img, 0, 0, imgW, imgH);

      // 4. Gambar Area Footer Pesan
      if (footerHeight > 0) {
        // Ambil sampel warna background paling bawah
        const pixelData = ctx.getImageData(10, imgH - 10, 1, 1).data;
        const bgColor = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;

        ctx.fillStyle = bgColor;
        ctx.fillRect(0, imgH, canvas.width, footerHeight);

        const textColor = (pixelData[0] < 128) ? "#FFFFFF" : "#2B1E1E";

        let currentY = imgH + (28 * scale);

        // Garis Pemisah Rapi & Tajam
        ctx.strokeStyle = textColor;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = Math.round(1.5 * scale);

        const gapCenter = Math.round(25 * scale);
        ctx.beginPath();
        ctx.moveTo(50 * scale, currentY);
        ctx.lineTo((canvas.width / 2) - gapCenter, currentY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo((canvas.width / 2) + gapCenter, currentY);
        ctx.lineTo(canvas.width - (50 * scale), currentY);
        ctx.stroke();

        // Aksen Bintang
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = textColor;
        ctx.font = `${Math.round(15 * scale)}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("✦", canvas.width / 2, currentY + Math.round(5 * scale));

        ctx.globalAlpha = 1.0;
        currentY += Math.round(38 * scale);

        // Cetak Nama Tamu (High Definition Font)
        if (name) {
          ctx.font = `bold ${fontSizeName}px 'Plus Jakarta Sans', sans-serif`;
          ctx.fillText(`From: ${name}`, canvas.width / 2, currentY);
          currentY += Math.round(32 * scale);
        }

        // Cetak Pesan Ucapan Multi-baris
        if (msgLines.length > 0) {
          ctx.font = `italic ${fontSizeMsg}px 'Plus Jakarta Sans', sans-serif`;
          ctx.fillStyle = textColor;
          ctx.globalAlpha = 0.88;

          msgLines.forEach(line => {
            ctx.fillText(line, canvas.width / 2, currentY);
            currentY += lineHeight;
          });
        }
      }

      // Export JPEG dengan Kualitas Kerapatan 100% (1.0)
      const finalDataUrl = canvas.toDataURL('image/jpeg', 1.0);
      callback(finalDataUrl);
    };
    img.src = photoUrl;
  }

  function switchTab(tabId, btnElem) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElem.classList.add('active');

    if (tabId === 'tab-gallery') {
      loadGalleryAdmin();
    }
  }

  // 1. KONTROL SAKLAR EVENT
  db.collection('settings').onSnapshot(snapshot => {
    const container = document.getElementById('project-list-container');
    container.innerHTML = '';

    if (snapshot.empty) {
      container.innerHTML = '<p style="font-size: 0.75rem; color: #999;">Belum ada projek.</p>';
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const docId = doc.id;
      const fileName = data.fileName || docId;
      const isActive = data.isActive === true;

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="info-left">
          <div class="project-name">${fileName}</div>
          <div class="project-id">ID: ${docId}</div>
          <span class="badge ${isActive ? 'badge-on' : 'badge-off'}">
            ${isActive ? 'ON' : 'OFF'}
          </span>
        </div>
        <div style="display:flex; align-items:center;">
          <button class="btn-toggle ${isActive ? 'btn-on' : 'btn-off'}" onclick="toggleEventStatus('${docId}', ${isActive})">
            ${isActive ? 'OFF' : 'ON'}
          </button>
          <button class="btn-delete" title="Hapus" onclick="deleteProject('${docId}')">🗑️</button>
        </div>
      `;
      container.appendChild(card);
    });
  });

  function addNewProject() {
    const fileName = document.getElementById('input-filename').value.trim();
    const docId = document.getElementById('input-docid').value.trim();

    if (!fileName || !docId) {
      alert("Harap isi Nama File dan ID Dokumen!");
      return;
    }

    db.collection('settings').doc(docId).set({
      fileName: fileName,
      isActive: true,
      title: "Riyan & Amelia",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true })
    .then(() => {
      document.getElementById('input-filename').value = '';
      document.getElementById('input-docid').value = '';
    });
  }

  function toggleEventStatus(docId, currentStatus) {
    db.collection('settings').doc(docId).set({ isActive: !currentStatus }, { merge: true });
  }

  function deleteProject(docId) {
    if (confirm(`Hapus projek "${docId}"?`)) {
      db.collection('settings').doc(docId).delete();
    }
  }

  // 2. KELOLA GALERI
  function loadGalleryAdmin() {
    const container = document.getElementById('gallery-grid-container');

    db.collection('posts').onSnapshot(snapshot => {
      container.innerHTML = '';
      allGalleryPosts = [];
      document.getElementById('check-select-all').checked = false;

      if (snapshot.empty) {
        container.innerHTML = '<p style="font-size: 0.75rem; color: #999; grid-column: span 3; text-align: center;">Belum ada foto yang masuk di galeri.</p>';
        updateCounters();
        return;
      }

      snapshot.forEach(doc => {
        allGalleryPosts.push({ id: doc.id, ...doc.data() });
      });

      allGalleryPosts.sort((a, b) => {
        const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
        const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
        return timeA - timeB;
      });

      allGalleryPosts.forEach(data => {
        const postId = data.id;
        const name = data.name || 'Tamu';
        const msg = data.message || '-';

        const card = document.createElement('div');
        card.className = 'gallery-grid-card';
        card.id = `card-${postId}`;

        card.innerHTML = `
          <div class="card-checkbox-wrapper" onclick="event.stopPropagation()">
            <input type="checkbox" class="card-checkbox post-select-cb" value="${postId}" onchange="updateCardStyle(this, '${postId}')">
          </div>
          <div class="gallery-thumb-box" onclick="openAdminModal('${postId}', '${name}', '${msg.replace(/'/g, "\\'")}', '${data.photoData}')">
            <img src="${data.photoData}" class="gallery-thumb-grid" alt="Thumb">
          </div>
          <div class="gallery-grid-name" onclick="openAdminModal('${postId}', '${name}', '${msg.replace(/'/g, "\\'")}', '${data.photoData}')">${name}</div>
          <div class="gallery-grid-msg" onclick="openAdminModal('${postId}', '${name}', '${msg.replace(/'/g, "\\'")}', '${data.photoData}')">"${msg}"</div>
        `;
        container.appendChild(card);
      });

      updateCounters();
    });
  }

  function updateCardStyle(cb, postId) {
    const card = document.getElementById(`card-${postId}`);
    if (cb.checked) card.classList.add('selected');
    else card.classList.remove('selected');

    updateCounters();
  }

  function updateCounters() {
    const totalCount = allGalleryPosts.length;
    const selectedCount = document.querySelectorAll('.post-select-cb:checked').length;

    document.getElementById('stat-total-photos').innerText = `Total Foto: ${totalCount}`;
    document.getElementById('stat-selected-photos').innerText = `Terpilih: ${selectedCount}`;
  }

  function toggleSelectAll(mainCb) {
    const checkboxes = document.querySelectorAll('.post-select-cb');
    checkboxes.forEach(cb => {
      cb.checked = mainCb.checked;
      const card = document.getElementById(`card-${cb.value}`);
      if (card) {
        if (mainCb.checked) card.classList.add('selected');
        else card.classList.remove('selected');
      }
    });

    updateCounters();
  }

  // UNDUH MASAL (POLOS ATAU DENGAN PESAN)
  function downloadSelectedPosts(withMessage) {
    const selectedCbs = document.querySelectorAll('.post-select-cb:checked');
    if (selectedCbs.length === 0) {
      alert("Harap pilih/centang minimal 1 foto untuk diunduh!");
      return;
    }

    alert(`Mulai memproses dan mengunduh ${selectedCbs.length} foto terpilih...`);

    selectedCbs.forEach((cb, idx) => {
      const postId = cb.value;
      const postData = allGalleryPosts.find(p => p.id === postId);
      if (postData) {
        setTimeout(() => {
          if (withMessage) {
            generateImageWithText(postData.photoData, postData.name, postData.message, (finalDataUrl) => {
              const fileName = formatFileName(postData.name, postData.message, true);
              const a = document.createElement('a');
              a.href = finalDataUrl;
              a.download = fileName;
              a.click();
            });
          } else {
            const fileName = formatFileName(postData.name, postData.message, false);
            const a = document.createElement('a');
            a.href = postData.photoData;
            a.download = fileName;
            a.click();
          }
        }, idx * 350);
      }
    });
  }

  function deleteSelectedPosts() {
    const selectedCbs = document.querySelectorAll('.post-select-cb:checked');
    if (selectedCbs.length === 0) {
      alert("Harap pilih/centang minimal 1 foto untuk dihapus!");
      return;
    }

    if (confirm(`Apakah kamu yakin ingin menghapus ${selectedCbs.length} foto terpilih sekaligus dari galeri?`)) {
      const batch = db.batch();
      selectedCbs.forEach(cb => {
        const docRef = db.collection('posts').doc(cb.value);
        batch.delete(docRef);
      });

      batch.commit()
        .then(() => alert(`${selectedCbs.length} foto berhasil dihapus!`))
        .catch(err => alert("Gagal menghapus: " + err.message));
    }
  }

  // MODAL INDIVIDUAL
  let activePostId = null;
  let activePhotoUrl = "";
  let activeSenderName = "";
  let activeSenderMsg = "";

  function openAdminModal(postId, name, message, photoData) {
    activePostId = postId;
    activePhotoUrl = photoData;
    activeSenderName = name;
    activeSenderMsg = message;

    document.getElementById('modal-sender-name').innerText = name;
    document.getElementById('modal-sender-msg').innerText = `"${message}"`;
    document.getElementById('modal-img-src').src = photoData;

    // OPSI 1: UNDUH POLOS
    document.getElementById('btn-modal-dl-plain').onclick = () => {
      const fileName = formatFileName(activeSenderName, activeSenderMsg, false);
      const a = document.createElement('a');
      a.href = activePhotoUrl;
      a.download = fileName;
      a.click();
    };

    // OPSI 2: UNDUH DENGAN PESAN
    document.getElementById('btn-modal-dl-msg').onclick = () => {
      generateImageWithText(activePhotoUrl, activeSenderName, activeSenderMsg, (finalDataUrl) => {
        const fileName = formatFileName(activeSenderName, activeSenderMsg, true);
        const a = document.createElement('a');
        a.href = finalDataUrl;
        a.download = fileName;
        a.click();
      });
    };

    document.getElementById('btn-modal-delete').onclick = () => {
      if (confirm(`Apakah kamu yakin ingin menghapus foto ucapan dari "${activeSenderName}" ini?`)) {
        db.collection('posts').doc(activePostId).delete()
          .then(() => {
            alert("Foto berhasil dihapus!");
            closeAdminModal();
          })
          .catch(err => alert("Gagal menghapus: " + err.message));
      }
    };

    document.getElementById('admin-modal').classList.remove('hidden');
  }

  function closeAdminModal() {
    document.getElementById('admin-modal').classList.add('hidden');
  }
</script>
